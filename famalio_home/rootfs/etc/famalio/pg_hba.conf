# Famalio Home add-on – PostgreSQL client authentication (read-only, from image).
# Unix socket only (listen_addresses is empty, so there is no TCP listener).
# peer: the connecting unix account must have the same name as the role.
# TYPE  DATABASE  USER           METHOD
local   all       postgres       peer
local   famalio   famalio_owner  peer
local   famalio   famalio_app    peer
# Everything else is rejected (no matching line).
